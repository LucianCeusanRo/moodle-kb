name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests for the function map, lookup tool and docs
        run: python -m unittest discover -s tests -v
      - name: Validate JSON map and offline lookup
        run: python tools/ci_check.py
